{% extends "base.html" %}
{% block title %}お支払いの中断 | はちまん産直マルシェ{% endblock %}
{% block content %}
<h1>お支払いは完了していません</h1>
<p>注文 #{{ order.id }}（{{ order.total_amount|yen }}）の状態: <strong>{{ order.status_label }}</strong></p>
{% if order.status == "pending" %}
<p>この注文を取り消すと、押さえていた在庫が戻ります。</p>
<form method="post" action="{{ url_for('orders.cancel', order_id=order.id) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit" class="secondary">この注文を取り消す</button>
</form>
{% endif %}
<p><a href="{{ url_for('orders.show', order_id=order.id) }}">注文詳細へ</a></p>
{% endblock %}
